[package]
name = "unpakt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Engine for installing and managing portable Linux apps (AppImages, tarballs, deb/rpm/pacman packages) per user"
readme = "../../README.md"
keywords = ["appimage", "installer", "linux", "package-manager"]
categories = ["command-line-utilities"]
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-io = "2.6.0"
backhand = "0.25.5"
bzip2 = "0.6.1"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-lite = "2.6.1"
goblin = "0.10.7"
hex = "0.4.3"
liblzma = { version = "0.4.9", features = ["parallel"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zstd = "0.14.3"

[dev-dependencies]
ar = "0.9.0"
