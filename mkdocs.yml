# Documentation website, published to GitHub Pages by .github/workflows/docs.yml.
# Build locally: scripts/build_site.py && mkdocs serve
site_name: unpakt
site_url: https://krotrn.github.io/unpakt/
site_description: >-
  Install AppImages, tarballs and deb, rpm and pacman packages on Linux per
  user, from a file, a URL or a GitHub repository, with updates, rollback and
  launcher entries.
site_author: krotrn
repo_url: https://github.com/krotrn/unpakt
repo_name: krotrn/unpakt
edit_uri: ""
docs_dir: site-src
copyright: MIT or Apache-2.0 licensed

theme:
  name: material
  custom_dir: website/theme
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - content.code.copy
    - navigation.instant
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Architecture: ARCHITECTURE.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krotrn/unpakt
