name: Packages

# Builds the Arch package, the Debian/Ubuntu package and the AppImage, and
# checks that they install and run. Runs on pull requests and main, and is
# called by release.yml, which publishes the artifacts built here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib rust gtk4 libadwaita
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder "$GITHUB_WORKSPACE"
          mode=local
          if [[ $GITHUB_REF == refs/tags/v* ]]; then mode=release; fi
          sudo -u builder --preserve-env=GITHUB_REF_NAME packaging/arch/ci-build.sh "$mode"

      - name: Install and smoke test
        run: |
          pacman -U --noconfirm packaging/arch/out/*.pkg.tar.zst
          pacman -S --noconfirm --needed desktop-file-utils appstream
          unpakt --version
          unpakt --help >/dev/null
          test -x /usr/bin/unpakt-gui
          test -f /usr/share/applications/io.github.krotrn.Unpakt.desktop
          test -f /usr/share/metainfo/io.github.krotrn.Unpakt.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.krotrn.Unpakt.svg
          test -s /usr/share/bash-completion/completions/unpakt
          test -s /usr/share/zsh/site-functions/_unpakt
          test -s /usr/share/fish/vendor_completions.d/unpakt.fish
          desktop-file-validate /usr/share/applications/io.github.krotrn.Unpakt.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.krotrn.Unpakt.metainfo.xml

      - name: Desktop app starts
        run: |
          pacman -S --noconfirm --needed python xorg-server-xvfb xorg-xwininfo dbus imagemagick ttf-dejavu
          dbus-run-session -- python3 scripts/gui_smoke.py --screenshot gui-arch.png unpakt-gui

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshot-arch-package
          path: gui-arch.png
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          include-hidden-files: true
          if-no-files-found: error
          path: |
            packaging/arch/out/*.pkg.tar.zst
            packaging/arch/out/PKGBUILD
            packaging/arch/out/.SRCINFO

  deb:
    name: Build Debian/Ubuntu package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Built on the oldest supported LTS (GTK 4.14, libadwaita 1.5).
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dpkg-dev pkg-config libgtk-4-dev libadwaita-1-dev gzip \
            lintian git curl ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/deb/build.sh

      - name: Lintian
        run: lintian --info --display-info --fail-on error packaging/deb/out/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          if-no-files-found: error
          path: packaging/deb/out/*.deb

  deb-install:
    name: Install .deb on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: deb-package
          path: deb

      - name: Install and smoke test
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./deb/*.deb desktop-file-utils appstream
          unpakt --version
          unpakt --help >/dev/null
          test -x /usr/bin/unpakt-gui
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.krotrn.Unpakt.svg
          test -s /usr/share/bash-completion/completions/unpakt
          test -s /usr/share/zsh/vendor-completions/_unpakt
          test -s /usr/share/fish/vendor_completions.d/unpakt.fish
          desktop-file-validate /usr/share/applications/io.github.krotrn.Unpakt.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.krotrn.Unpakt.metainfo.xml
          if ldd /usr/bin/unpakt-gui | grep 'not found'; then
            echo "::error::unpakt-gui has unresolved libraries on ${{ matrix.image }}"
            exit 1
          fi

      - name: Desktop app starts
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 xvfb x11-utils dbus imagemagick fonts-dejavu-core
          dbus-run-session -- python3 scripts/gui_smoke.py --screenshot gui.png unpakt-gui

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshot-deb-${{ strategy.job-index }}
          path: gui.png
          if-no-files-found: ignore

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dpkg-dev pkg-config curl file patchelf git \
            desktop-file-utils libgtk-4-dev libadwaita-1-dev librsvg2-common \
            libglib2.0-bin shared-mime-info ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/appimage/build.sh

      # The container has no FUSE, so run the image by extracting it.
      - name: Smoke test
        run: |
          image=$(echo packaging/appimage/out/*.AppImage)
          chmod +x "$image"
          "$image" --appimage-extract-and-run cli --version
          "$image" --appimage-extract-and-run cli --help >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          if-no-files-found: error
          path: packaging/appimage/out/*.AppImage

  # The AppImage is what other distributions get: start its desktop app on them.
  # Like every AppImage it leaves X11, xcb, Wayland, fontconfig, freetype,
  # harfbuzz and fribidi to the system (AppImage's exclude list): any desktop has
  # them (and the krb5 and gcrypt helpers libcom_err and libgpg-error), a bare
  # container doesn't, so each image installs them.
  appimage-gui:
    name: AppImage desktop app on ${{ matrix.name }}
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            install: >-
              dnf install -y python3 xorg-x11-server-Xvfb xwininfo dbus-daemon dbus-tools
              ImageMagick dejavu-sans-fonts libX11 libxcb fontconfig freetype harfbuzz fribidi
              libwayland-client
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            install: >-
              zypper --non-interactive install python3 xorg-x11-server-Xvfb xwininfo dbus-1-daemon
              ImageMagick dejavu-fonts libX11-6 libxcb1 libfontconfig1 libfreetype6 libharfbuzz0
              libfribidi0 libwayland-client0
          - name: Arch Linux
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed python xorg-server-xvfb xorg-xwininfo dbus
              imagemagick ttf-dejavu libx11 libxcb fontconfig freetype2 harfbuzz fribidi wayland
          - name: Debian 13
            image: debian:13
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              --no-install-recommends python3 xvfb x11-utils dbus imagemagick fonts-dejavu-core
              libx11-6 libxcb1 libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libwayland-client0
              libcom-err2 libgpg-error0
    steps:
      - name: Install a headless display
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: appimage

      # The container has no FUSE, so run the image by extracting it.
      - name: Desktop app starts
        run: |
          image=$(echo appimage/*.AppImage)
          chmod +x "$image"
          dbus-run-session -- python3 scripts/gui_smoke.py --screenshot gui.png -- "$image" --appimage-extract-and-run

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshot-appimage-${{ strategy.job-index }}
          path: gui.png
          if-no-files-found: ignore
