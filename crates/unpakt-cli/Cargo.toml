[package]
name = "unpakt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Install, update and roll back AppImages and tarballs per user"
readme = "../../README.md"
keywords = ["appimage", "installer", "linux", "package-manager"]
categories = ["command-line-utilities"]
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "unpakt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = "1.1.10"
libc = "0.2.191"
semver = "1.0.28"
tar = "0.4.46"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unpakt-core = { version = "0.1.0", path = "../unpakt-core" }

[dev-dependencies]
hex = "0.4.3"
sha2 = "0.11.1"
