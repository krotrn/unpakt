[package]
name = "unpakt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Engine for installing and managing portable Linux apps (AppImages, tarballs, deb/rpm/pacman packages) per user"
readme = "../../README.md"
keywords = ["appimage", "installer", "linux", "package-manager"]
categories = ["command-line-utilities"]
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# zstd is decoded by our own decompressor with zstd 0.14 (the RustSec advisories hit the zstd 0.13 that backhand's feature uses).
backhand = { version = "0.25.5", default-features = false, features = ["xz", "gzip", "lz4", "parallel", "error-strings"] }
bzip2 = "0.6.1"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-lite = "2.6.1"
goblin = "0.10.7"
hex = "0.4.3"
liblzma = { version = "0.4.9", features = ["parallel"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"
# Async zbus on its own zruntime, driven by a blocking `block_on`: no tokio, so the core stays blocking and musl-static.
zbus = { version = "6.1.0", default-features = false, features = ["default-rt"] }
# Must stay on the zruntime line zbus uses: SharedRuntime::current() has to see zbus's runtime.
zruntime = { version = "0.2.1", default-features = false, features = ["helper"] }
zstd = "0.14.3"

[dev-dependencies]
ar = "0.9.0"
