name: Docs

# Builds the documentation website (README, website/, ARCHITECTURE.md,
# CONTRIBUTING.md, CHANGELOG.md) and publishes it to GitHub Pages at
# https://krotrn.github.io/unpakt/. Pull requests only build it.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - ARCHITECTURE.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - website/**
      - zensical.toml
      - scripts/build_site.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - ARCHITECTURE.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - website/**
      - zensical.toml
      - scripts/build_site.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Zensical
        # Zensical is pre-1.0; a minor release may change the configuration.
        run: python -m pip install "zensical>=0.0.72,<0.1"

      - name: Build
        run: |
          python scripts/build_site.py
          zensical build --clean --strict

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
