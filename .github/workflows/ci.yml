name: CI

# Tests and lint, a build on the declared minimum Rust version, and the static
# musl CLI. Callable from a release workflow so a release ships only what
# passed exactly these checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Shell scripts (shellcheck)
        run: shellcheck get.sh install.sh packaging/*/*.sh packaging/appimage/AppRun

      - name: Script tests (release scripts, get.sh)
        run: python3 -m unittest discover -s scripts/tests -v

  test:
    name: Tests and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ubuntu 24.04 ships GTK 4.14 and libadwaita 1.5, the oldest versions the GUI supports.
      - name: Install GTK and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev desktop-file-utils appstream

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tests with coverage
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Desktop entry and metainfo
        run: |
          desktop-file-validate data/io.github.krotrn.Unpakt.desktop
          appstreamcli validate --no-net data/io.github.krotrn.Unpakt.metainfo.xml

      - name: Core stays free of GUI dependencies
        run: |
          if cargo tree -p unpakt-core | grep -E 'gtk|glib|relm4|adw'; then
            echo "GUI dependency leaked into unpakt-core"
            exit 1
          fi

  # The newest end: Arch's own Rust, GTK and libadwaita packages.
  arch:
    name: Tests on Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install Rust, GTK and libadwaita
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v7

      # Some tests check read-only directories, which root can write anyway.
      - name: Create an unprivileged user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Tests
        run: runuser -u builder -- env HOME=/home/builder cargo test --workspace --locked

      - name: Clippy
        run: runuser -u builder -- env HOME=/home/builder cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GTK and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --workspace --all-targets --locked

  musl:
    name: Static musl CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build -p unpakt-cli --release --locked --target x86_64-unknown-linux-musl

      - name: Binary is static and runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/unpakt
          file "$bin"
          file "$bin" | grep -qE 'static(ally|-pie) linked'
          "$bin" --version

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: unpakt-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/unpakt
          if-no-files-found: error
