name: CI

# Tests and lint, a build on the declared minimum Rust version, and the static
# musl CLI. Callable from a release workflow so a release ships only what
# passed exactly these checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Tests and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ubuntu 24.04 ships GTK 4.14 and libadwaita 1.5, the versions the GUI targets.
      - name: Install GTK and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Core stays free of GUI dependencies
        run: |
          if cargo tree -p unpakt-core | grep -E 'gtk|glib|relm4|adw'; then
            echo "GUI dependency leaked into unpakt-core"
            exit 1
          fi

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GTK and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

  musl:
    name: Static musl CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p unpakt-cli --release --locked --target x86_64-unknown-linux-musl

      - name: Binary is static and runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/unpakt
          file "$bin"
          file "$bin" | grep -qE 'static(ally|-pie) linked'
          "$bin" --version

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: unpakt-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/unpakt
          if-no-files-found: error
