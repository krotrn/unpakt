[package]
name = "unpakt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unpakt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unpakt-core = { version = "0.1.0", path = "../unpakt-core" }

[dev-dependencies]
flate2 = "1.1.10"
tar = "0.4.46"
tempfile = "3.27.0"
